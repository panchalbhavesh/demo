# NOT currently used by 04-scylla-statefulset.yaml. The StatefulSet
# configures ScyllaDB entirely via command-line flags (simplest path for a
# demo: no auth, default settings). Left here for later hardening: mount
# this as /etc/scylla/scylla.yaml (or merge into it) once you want to turn
# on authenticator/authorizer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scylladb-config
  namespace: scylla
data:
  scylla.yaml: |
    authenticator: PasswordAuthenticator
    authorizer: CassandraAuthorizer
