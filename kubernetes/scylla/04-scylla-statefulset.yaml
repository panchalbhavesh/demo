# Plain StatefulSet ScyllaDB deployment — no Operator, no cert-manager.
# Simplest path for this demo: 3 replicas, one per AZ (best-effort via
# topologySpreadConstraints + podAntiAffinity), gp3 EBS storage, no auth.
#
# Known ScyllaDB-on-k8s gotcha (hit and fixed once before in this project):
# you MUST pass --broadcast-rpc-address alongside --rpc-address=0.0.0.0, or
# ScyllaDB crash-loops with bad_configuration_error. Already handled below.
apiVersion: v1
kind: Service
metadata:
  name: scylla
  namespace: scylla
  labels:
    app: scylla
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: cql
      port: 9042
    - name: inter-node
      port: 7000
    - name: inter-node-tls
      port: 7001
  selector:
    app: scylla
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scylla-pdb
  namespace: scylla
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: scylla
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scylla
  namespace: scylla
spec:
  serviceName: scylla
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: scylla
  template:
    metadata:
      labels:
        app: scylla
    spec:
      terminationGracePeriodSeconds: 90
      # Fresh EBS volumes mount as root:root. The official scylla image runs
      # as a non-root "scylla" user, which can't create /var/lib/scylla/data
      # on a volume it doesn't own — this crash-loops with
      # "PermissionError: [Errno 13] Permission denied: '/var/lib/scylla/data'"
      # otherwise. fsGroup makes kubelet chown the volume's group to match on
      # mount, so the container can write to it.
      securityContext:
        fsGroup: 999
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: scylla
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: scylla
      containers:
        - name: scylla
          image: docker.io/scylladb/scylla:2026.1.3
          command: ["/docker-entrypoint.py"]
          args:
            - --cluster-name=scylla-demo-source
            - --seeds=scylla-0.scylla.scylla.svc.cluster.local
            - --listen-address=0.0.0.0
            - --rpc-address=0.0.0.0
            - --broadcast-address=$(POD_IP)
            - --broadcast-rpc-address=$(POD_IP)
            - --overprovisioned=1
            - --developer-mode=1
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: cql
              containerPort: 9042
            - name: inter-node
              containerPort: 7000
            - name: inter-node-tls
              containerPort: 7001
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "1"
              memory: 3Gi
          readinessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 90
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/scylla
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: scylla-gp3-retain
        resources:
          requests:
            storage: 5Gi
