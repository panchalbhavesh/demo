name: ScyllaDB restore

# Manual trigger ONLY — restore is destructive (overwrites live sstables),
# so this deliberately has no schedule trigger. Requires typing "restore"
# into the confirm input, on top of picking the backup tag, as a guard
# against fat-fingering the wrong workflow run.
on:
  workflow_dispatch:
    inputs:
      backup_tag:
        description: "Backup tag to restore from, e.g. backup-20260826073528 (see s3://scylla-demo-source-backups/)"
        required: true
        type: string
      keyspace:
        description: "Keyspace to restore"
        required: false
        default: "demo"
        type: string
      confirm:
        description: 'Type "restore" to confirm — this overwrites live data'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER_NAME: scylla-demo-source
  SCYLLA_BACKUP_BUCKET: scylla-demo-source-backups
  NAMESPACE: scylla
  AWS_ROLE_ARN: ${{ secrets.SCYLLA_BACKUP_ROLE_ARN }}
  BACKUP_TAG: ${{ inputs.backup_tag }}
  RESTORE_KEYSPACE: ${{ inputs.keyspace }}

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'restore' }}
        run: |
          echo "::error::confirm input must be exactly 'restore' — got '${{ inputs.confirm }}'. Aborting."
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Run restore
        run: sh kubernetes/scylla/backup/restore.sh
